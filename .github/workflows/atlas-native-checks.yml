    - name: Extract checksum-verified source
      run: |
        python3 - <<'PYCODE'
        import base64, hashlib, io, os, pathlib, zipfile
        payload = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "atlas-source.b64").read_text()
        raw = base64.b64decode(payload)
        if hashlib.sha256(raw).hexdigest() != "be043635d4ebb0208c2db9d09468092f6e2cdbd47d245e6cd6580eabad339275":
            raise SystemExit("Source snapshot checksum mismatch")
        root = pathlib.Path("native-ci")
        with zipfile.ZipFile(io.BytesIO(raw)) as archive:
            for item in archive.infolist():
                path = pathlib.PurePosixPath(item.filename)
                if path.is_absolute() or ".." in path.parts or not path.parts or path.parts[0] != "OVAAtlasNative":
                    raise SystemExit("Invalid source archive path")
                if (item.external_attr >> 16) & 0o170000 == 0o120000:
                    raise SystemExit("Source archive symlink rejected")
            archive.extractall(root)
        print("Verified and extracted native source checkpoint")
        PYCODE
    - name: Run Swift core regressions
      working-directory: native-ci/OVAAtlasNative
      run: swift test --package-path AtlasCore
    - name: Check both generated project structures
      working-directory: native-ci/OVAAtlasNative
      run: python3 -m unittest discover -s tests -p 'test_project_generation.py' -v
    - name: Compile UIKit app without signing or model SDK
      working-directory: native-ci/OVAAtlasNative
      run: |
        python3 create_xcode_project.py
        xcodebuild -project OVAAtlas.xcodeproj -scheme OVAAtlas \
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath "$RUNNER_TEMP/AtlasBuild" \
          CODE_SIGNING_ALLOWED=NO build
    - name: Record scope of successful checks
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" <<'SCOPE'
        Swift core tests and the SDK-free UIKit simulator build passed.
        This does not verify the optional MediaGenerationKit integration,
        real image generation, app signing, or physical iPhone behavior.
        No provider request, model download, or deployment was performed.
        SCOPE
